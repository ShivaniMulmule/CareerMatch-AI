version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: careermatch_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=careermatch_ai

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: careermatch_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=careermatch_ai
      - JWT_SECRET_KEY=careermatch-production-jwt-secret-key-btech-2026
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: careermatch_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
